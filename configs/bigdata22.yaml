inherits: default.yaml

data:
  raw_dir: data/raw/BIGDATA22
  processed_name: bigdata22
  date_range:
    start: 2019-07-05
    end: 2020-06-30

model:
  num_stocks: 48
  hidden_size: 256
  num_layers: 3
  num_heads: 8

training:
  lookback_window: 16
  batch_size: 64
  learning_rate: 0.0005
  max_epochs: 300
  output_dir: runs/bigdata22
