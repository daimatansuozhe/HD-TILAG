[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hd-tilag-reproduction"
version = "0.1.0"
description = "Reproduction code for HD-TILAG stock movement prediction."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "PyYAML>=6.0",
  "torch>=2.1",
  "tqdm>=4.66",
  "joblib>=1.3",
]

[project.optional-dependencies]
sentiment = [
  "accelerate>=0.28",
  "datasets>=2.18",
  "peft>=0.10",
  "transformers>=4.40",
  "trl>=0.8",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[project.scripts]
hdtilag-preprocess = "hd_tilag.cli.preprocess:main"
hdtilag-train = "hd_tilag.cli.train:main"
hdtilag-evaluate = "hd_tilag.cli.evaluate:main"
hdtilag-demo-data = "hd_tilag.cli.make_demo_data:main"
hdtilag-run-experiments = "hd_tilag.cli.run_experiments:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
